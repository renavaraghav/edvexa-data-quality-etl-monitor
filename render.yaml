# Render Blueprint Specification for EDVEXA Data Quality & ETL Monitor
# Reference: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: edvexa-data-quality-etl-monitor
    runtime: python
    region: singapore
    plan: free
    branch: main
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: STORAGE_BACKEND
        value: neon
      # Preserve the assignment-demo workflow. Set to "true" to disable the public reset endpoint.
      - key: FORCE_DISABLE_DESTRUCTIVE_RESET
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_RESET_TOKEN
        sync: false
      - key: NEON_STORAGE_ENDPOINT
        sync: false
      - key: NEON_STORAGE_BUCKET_NAME
        value: edvexa-uploads
      - key: NEON_STORAGE_ACCESS_KEY_ID
        sync: false
      - key: NEON_STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "*"
      - key: SURVEYS_STORAGE_PATH
        value: ./surveys_storage
    # NOTE: Render Free Web Services do not support persistent disks ('disk:').
    # For Free Tier deployments, storage durability is provided by Neon/S3 object storage
    # (STORAGE_BACKEND: neon) with self-healing local cache in ./surveys_storage.
    # To attach an SSD persistent disk, change plan to 'starter' ($7/mo) and uncomment:
    # disk:
    #   name: edvexa-surveys-data
    #   mountPath: /var/data
    #   sizeGB: 1
