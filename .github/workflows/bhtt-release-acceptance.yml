name: BHTT release acceptance

on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  acceptance:
    name: BHTT 62 substantive questions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BHTT_RELEASE_APPROVAL_SHA256: ${{ vars.BHTT_RELEASE_APPROVAL_SHA256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Verify authoritative questionnaire and approval
        run: >-
          python -m scripts.verify_bhtt_inventory release/evidence/bhtt.docx
          --inventory release/evidence/bhtt_inventory.json --require-ci-pin
