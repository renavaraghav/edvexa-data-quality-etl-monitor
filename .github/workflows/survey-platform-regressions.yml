name: Survey platform CI

on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  survey-regressions:
    name: Survey platform regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-browser.txt
      - name: Run isolated survey regressions
        run: >-
          python -m pytest -q
          tests/test_dynamic_survey_workflow.py
          tests/test_survey_workflow_contract.py
          tests/test_survey_scrubbing.py
          tests/test_survey_release_security.py
          tests/test_survey_sql_bootstrap.py
          tests/test_survey_historical_validation.py
      - run: python -m playwright install --with-deps chromium
      - name: Check browser mapping, review, storage feedback and export
        run: >-
          python -m pytest -q
          tests/test_playwright_bhtt_workflow.py::test_browser_qc_review_reload_and_export
          tests/test_playwright_bhtt_workflow.py::test_browser_reports_upload_replication
          tests/test_playwright_bhtt_workflow.py::test_wide_csv_mapping_picker_can_select_columns_outside_the_preview
