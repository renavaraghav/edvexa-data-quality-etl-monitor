name: Survey platform CI

on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  survey-regressions:
    name: Survey platform regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Run isolated survey regressions
        run: >-
          python -m pytest -q
          tests/test_dynamic_survey_workflow.py
          tests/test_survey_workflow_contract.py
          tests/test_survey_scrubbing.py
          tests/test_survey_release_security.py
          tests/test_survey_sql_bootstrap.py
          tests/test_survey_historical_validation.py
